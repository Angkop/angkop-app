name: Ingest jobs

# 11:30pm PHT (Asia/Manila, UTC+8) is 15:30 UTC. GitHub schedules in UTC only, and can start a
# run late when its runners are busy (seen: several hours).
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report only, write nothing'
        type: boolean
        default: false

# A second run can't start while one is going. The Redis lock in the ingest itself covers
# runs started from anywhere else.
concurrency:
  group: ingest-jobs
  cancel-in-progress: false

jobs:
  ingest:
    # Set the repository variable INGEST_ENABLED to "false" to pause the nightly run.
    if: vars.INGEST_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The embeddings come from the same FastAPI service the app uses, started right here on
      # the runner, so the nightly run never depends on anyone's laptop or tunnel being up.
      # Only /embed is called; the Gemini and NCF parts of the service sit idle.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Cache the Sentence-BERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sbert-all-MiniLM-L6-v2
      - name: Install ML service
        run: pip install -r ml/requirements.txt
      - name: Start ML service
        working-directory: ml
        env:
          # The service builds its Gemini clients at import time and refuses to start without
          # a key. Ingestion only calls /embed, so a placeholder is enough and no real key
          # needs to be handed to this workflow.
          GEMINI_API_KEY: unused-by-ingest
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/ml.log" 2>&1 &
          # Startup loads the model, so wait for /health instead of assuming it is ready.
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "ML service did not become healthy within 3 minutes"
          cat "$RUNNER_TEMP/ml.log"
          exit 1

      - name: Ingest jobs
        working-directory: apps/server
        run: pnpm ingest:jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ML_SERVICE_URL: http://127.0.0.1:8000
          HEADCOUNTLABS_API_KEY: ${{ secrets.HEADCOUNTLABS_API_KEY }}
          WEB_URL: ${{ secrets.WEB_URL }}
          INGEST_DRY_RUN: ${{ inputs.dry_run && 'true' || vars.INGEST_DRY_RUN }}
      - name: ML service log
        if: failure()
        run: cat "$RUNNER_TEMP/ml.log" || true
