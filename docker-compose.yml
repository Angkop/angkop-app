services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: angkop
      POSTGRES_PASSWORD: angkop
      POSTGRES_DB: angkop
    ports:
      - "5432:5432"
    volumes:
      - angkop_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  angkop_db_data:
